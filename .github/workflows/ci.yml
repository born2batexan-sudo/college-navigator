name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Reject tracked environment files
        shell: bash
        run: |
          tracked="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '\.example$' || true)"
          if [ -n "$tracked" ]; then
            echo "::error::Environment files must not be tracked: $tracked"
            exit 1
          fi
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Install
        working-directory: web
        run: npm ci
      - name: Test
        working-directory: web
        run: npm test
      - name: Build
        working-directory: web
        run: npm run build
      - name: Reject high/critical production advisories
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: { python-version: "3.12", cache: pip, cache-dependency-path: agents/requirements.lock }
      - name: Install locked Python dependencies
        run: pip install --require-hashes -r agents/requirements.lock
      - name: Python syntax
        run: python -m py_compile agents/*.py
