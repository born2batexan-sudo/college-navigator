name: School requests (manual, supervised)
on:
  workflow_dispatch:
    inputs:
      task:
        description: What to run
        type: choice
        options: [process the next requested school, load the school directory]
        default: load the school directory
      year:
        description: Directory year to try first
        required: false
        default: "2024"
concurrency:
  group: research-school
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  process:
    environment: production-research
    if: inputs.task == 'process the next requested school'
    runs-on: ubuntu-latest
    timeout-minutes: 160
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: agents/requirements.lock }
      - run: pip install --require-hashes -r agents/requirements.lock
      - name: Process one request
        working-directory: agents
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          QUEUE_AGENT_API_KEY: ${{ secrets.QUEUE_AGENT_API_KEY }}
          RESEARCH_WRITER_API_KEY: ${{ secrets.RESEARCH_WRITER_API_KEY }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: python -u process_requests.py | tee process.log
      - name: Save reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: request-run-reports
          path: |
            agents/run-report.json
            agents/run-report-recheck.json
          if-no-files-found: ignore
  directory:
    environment: production-directory
    if: inputs.task == 'load the school directory'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: agents/requirements.lock }
      - run: pip install --require-hashes -r agents/requirements.lock
      - name: Download IPEDS HD file
        env: { YEAR: "${{ inputs.year }}" }
        run: |
          YEAR="${YEAR:-2024}"; got=""
          for y in "$YEAR" $((YEAR-1)) $((YEAR-2)); do
            url="https://nces.ed.gov/ipeds/datacenter/data/HD${y}.zip"
            if curl -sSL --fail --retry 3 -o hd.zip "$url" && unzip -tq hd.zip >/dev/null 2>&1; then got="$y"; break; fi
          done
          test -n "$got"
      - name: Import directory
        working-directory: agents
        env:
          DIRECTORY_IMPORT_API_KEY: ${{ secrets.DIRECTORY_IMPORT_API_KEY }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: python -u import_ipeds.py --file ../hd.zip
